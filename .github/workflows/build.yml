# Builds the downloadable applications and publishes them as a GitHub Release.
#  - every push to main: test + build (downloads appear under Actions ▸ run ▸ Artifacts)
#  - pushing a tag such as v1.0.0: the same, plus a public Release page with the installers
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  ORIS_VERSION: "1.0.0"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: Mac-AppleSilicon }
          - { os: macos-13, name: Mac-Intel }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-22.04, name: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Linux display libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Tests
        run: |
          python -m pytest -q
          python tests/check_locales.py
      - name: Interface walk-through
        if: runner.os == 'Linux'
        run: python tests/ui_smoke.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build application
        run: python -m PyInstaller --noconfirm oris.spec
      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          QT_QPA_PLATFORM=offscreen dist/ORIS.app/Contents/MacOS/ORIS --selftest
          mkdir -p release dmg && cp -R dist/ORIS.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "ORIS" -srcfolder dmg -ov -format UDZO "release/ORIS-${ORIS_VERSION}-${{ matrix.name }}.dmg"
      - name: Package (Windows installer + portable zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\ORIS\ORIS.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist\ORIS -DestinationPath "release\ORIS-$env:ORIS_VERSION-Windows-Portable.zip"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          QT_QPA_PLATFORM=offscreen dist/ORIS/ORIS --selftest
          mkdir -p release && tar -czf "release/ORIS-${ORIS_VERSION}-Linux.tar.gz" -C dist ORIS
      - uses: actions/upload-artifact@v4
        with:
          name: ORIS-${{ matrix.name }}
          path: release/*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          name: ORIS ${{ github.ref_name }}
          body: |
            ## 下載 Download
            | 系統 System | 檔案 File |
            |---|---|
            | Mac（M1/M2/M3/M4 晶片 Apple Silicon） | `ORIS-…-Mac-AppleSilicon.dmg` |
            | Mac（Intel 晶片） | `ORIS-…-Mac-Intel.dmg` |
            | Windows 10/11 | `ORIS-…-Windows-Setup.exe`（安裝版）或 `…-Windows-Portable.zip`（免安裝） |
            | Linux | `ORIS-…-Linux.tar.gz` |

            **Mac 第一次開啟**：把 ORIS 拖進「應用程式」後打開，若出現「無法驗證開發者」，請到「系統設定 ▸ 隱私權與安全性」最下方按「強制打開」（Open Anyway），之後就能正常使用。
            **Windows**：若出現「Windows 已保護您的電腦」，按「其他資訊 ▸ 仍要執行」。
